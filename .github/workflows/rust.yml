  # Pull requests run a fixed set of seeds so the fuzzer is deterministic: the
  # same PR always generates the same SQL, a green run stays green, and a
  # failure blocks the merge and reproduces exactly. New random seeds run only
  # on pushes to main (differential-fuzzer-random below), where a failure is a
  # signal to investigate rather than a gate on an unrelated change.
  differential-fuzzer:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      DIFFERENTIAL_FUZZER_TIMEOUT_SECONDS: 180
    strategy:
      fail-fast: false
      matrix:
        # Each profile focuses a different workload so CI covers more than the
        # default statement distribution.
        profile: [balanced, ddl, triggers, writes, correlated-subqueries]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Build differential_fuzzer
        run: cargo build -p differential-fuzzer --bin differential_fuzzer
      - name: Run differential_fuzzer on a fixed set of seeds
        run: |
          # Reproduce a failure locally with:
          #   cargo run -p differential-fuzzer --bin differential_fuzzer -- \
          #     --seed <seed> --profile ${{ matrix.profile }} -n 1000
          for seed in 1 2 3 4 5 6; do
            exit_code=0
            # One slow statement must not consume the complete CI job.
            timeout --kill-after=10s "${DIFFERENTIAL_FUZZER_TIMEOUT_SECONDS}s" \
              target/debug/differential_fuzzer \
                --seed "$seed" --profile ${{ matrix.profile }} -n 1000 \
              || exit_code=$?
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              echo "::error::Differential fuzzer timed out after ${DIFFERENTIAL_FUZZER_TIMEOUT_SECONDS} seconds. Seed: $seed. Profile: ${{ matrix.profile }}."
            fi
            if [ "$exit_code" -ne 0 ]; then
              exit "$exit_code"
            fi
          done

  # Random seeds keep discovering new divergences. Run them only on pushes to
  # main, so a newly generated failing statement flags a real bug to look at
  # without blocking an unrelated pull request.
  differential-fuzzer-random:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      DIFFERENTIAL_FUZZER_TIMEOUT_SECONDS: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [balanced, ddl, triggers, writes, correlated-subqueries]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Build differential_fuzzer
        run: cargo build -p differential-fuzzer --bin differential_fuzzer
      - name: Run differential_fuzzer with random seeds
        run: |
          # A failure prints its seed and profile; reproduce with
          #   cargo run -p differential-fuzzer --bin differential_fuzzer -- \
          #     --seed <seed> --profile ${{ matrix.profile }} -n 1000
          for run_number in {1..10}; do
            # Select the seed first so a timeout still reports it.
            seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            echo "Starting random fuzzer run $run_number of 10. Seed: $seed. Profile: ${{ matrix.profile }}."
            exit_code=0
            # One slow statement must not consume the complete CI job.
            timeout --kill-after=10s "${DIFFERENTIAL_FUZZER_TIMEOUT_SECONDS}s" \
              target/debug/differential_fuzzer \
                --seed "$seed" --profile ${{ matrix.profile }} -n 1000 \
              || exit_code=$?
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              echo "::error::Differential fuzzer timed out after ${DIFFERENTIAL_FUZZER_TIMEOUT_SECONDS} seconds. Seed: $seed. Profile: ${{ matrix.profile }}."
            fi
            if [ "$exit_code" -ne 0 ]; then
              exit "$exit_code"
            fi
          done

  test-limbo:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true

      - name: Install uv
        uses: useblacksmith/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - uses: "./.github/shared/install_sqlite"
      - name: Test
        run: make test

  concurrent-simulator:
    name: "Concurrent simulator (${{ matrix.toolchain.label }}, ${{ matrix.profile.name }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - label: stable
            version: "1.88.0"
            rustflags: ""
          - label: nightly
            version: "nightly-2025-12-17"
            rustflags: "--cfg nightly"
        profile:
          - name: in-process
            iterations: 100
            args: "--mode fast --reopen-probability 0.001"
          - name: in-process-mvcc
            iterations: 25
            args: "--mode fast --reopen-probability 0.01 --enable-mvcc --allocation-fault-probability 0.01"
          - name: schema-clone-faults
            iterations: 10
            args: "--mode schema-clone-faults --reopen-probability 0.0001 --allocation-fault-probability 0.01"
          - name: btree-rebalance
            iterations: 5
            args: "--mode btree-rebalance --allocation-fault-probability 0"
          - name: multiprocess
            iterations: 10
            args: "--mode fast --multiprocess --connections-per-process 4 --processes 4"
          - name: multiprocess-kill
            iterations: 10
            args: "--mode fast --multiprocess --connections-per-process 4 --processes 4 --kill-probability 0.01"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain.version }}
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-whopper-${{ matrix.toolchain.label }}"
          cache-on-failure: true
      - name: Run turso_whopper regression tests
        if: matrix.profile.name == 'in-process'
        env:
          RUSTFLAGS: ${{ matrix.toolchain.rustflags }}
        run: cargo +${{ matrix.toolchain.version }} test -p turso_whopper --test regression_tests
        timeout-minutes: 15
      - name: Run turso_whopper (${{ matrix.toolchain.label }}, ${{ matrix.profile.name }})
        env:
          RUSTFLAGS: ${{ matrix.toolchain.rustflags }}
          WHOPPER_ARGS: ${{ matrix.profile.args }}
        run: |
          cargo +${{ matrix.toolchain.version }} build -p turso_whopper --release
          # A single whopper run drives its connections serially (one blocking
          # step at a time), so it only keeps about one core busy. Run
          # iterations concurrently to use the whole runner; per-iteration log
          # files keep output readable and preserve the failing seed.
          seq 1 ${{ matrix.profile.iterations }} | xargs -P 4 -n 1 bash -c '
            i="$1"
            log="whopper-run-$i.log"
            if ./target/release/turso_whopper $WHOPPER_ARGS >"$log" 2>&1; then
              echo "iteration $i ok: $(grep -m1 "^seed = " "$log")"
            else
              echo "iteration $i FAILED ($(grep -m1 "^seed = " "$log")):"
              cat "$log"
              exit 255
            fi
          ' _

  concurrent-simulator-windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Run Windows concurrent simulator multiprocess regressions
        run: cargo test -q -p turso_whopper --test regression_tests
      - name: Reclaim Windows runner disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker system prune --all --force
          }
          Get-ChildItem -LiteralPath ([System.IO.Path]::GetTempPath()) -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem
      - name: Run Windows concurrent simulator cross-platform regression
        # Each test preallocates 8 GiB backing files. Run serially to stay below
        # the Windows runner's per-job allocation limit.
        run: cargo test -q -p turso_whopper --test regression_tests_cross_platform -- --test-threads=1
      - name: Run Windows CLI multiprocess VFS regression
        run: cargo test -q -p turso_cli input::tests::experimental_win_iocp_backend_is_available_for_path_databases -- --exact
      - name: Run Windows core multiprocess regressions
        run: |
          cargo test -q -p turso_core --features "fs experimental_win_iocp" multiprocess_tests:: -- --nocapture
      - name: Run Windows multiprocess startup smoke
        run: cargo run -q -p turso_whopper -- --mode fast --multiprocess --connections-per-process 4 --processes 4 --kill-probability 0.01 --max-steps 10000

  test-sqlite:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/shared/install_sqlite"
      - name: build SQLite test extensions
        run: cargo build --package limbo_sqlite_test_ext --locked
      - name: Test
        run: SQLITE_EXEC="sqlite3" make test-compat
