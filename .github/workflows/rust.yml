name: Rust

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10
  # Capture stack traces when a test panics so CI failure reports are actionable.
  RUST_BACKTRACE: 1
  # Blacksmith Windows images ship VS Build Tools without LLVM, so the aegis
  # crate's clang-cl preference fails; force the MSVC compiler instead.
  CC_x86_64_pc_windows_msvc: cl.exe

jobs:
  license-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses

  cargo-fmt-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Check formatting (fuzz)
        run: cd fuzz && cargo fmt --check

  check-bindings:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install bindgen
        run: cargo install --version 0.71.1 bindgen-cli
      - name: Regenerate sdk-kit bindings
        run: cd sdk-kit && ./bindgen.sh
      - name: Regenerate sync/sdk-kit bindings
        run: cd sync/sdk-kit && ./bindgen.sh
      - name: Check bindings are up to date
        run: |
          if ! git diff --exit-code sdk-kit/src/bindings.rs sync/sdk-kit/src/bindings.rs; then
            echo "Bindings are out of date. Run ./bindgen.sh in sdk-kit/ and sync/sdk-kit/ and commit the changes."
            exit 1
          fi

  build-native:
    timeout-minutes: 60
    strategy:
      matrix:
        os:
          [
            blacksmith-4vcpu-ubuntu-2404,
            blacksmith-6vcpu-macos-latest,
            blacksmith-8vcpu-windows-2025,
          ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov
      # Blacksmith Windows images ship no LLVM; the all-features build pulls in
      # pg_query, whose bindgen needs libclang.dll.
      - name: Install LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Set up Python 3.10
        uses: useblacksmith/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install sqlite3:x64-windows-static-md
      - name: Build
        run: cargo build --verbose --locked --all-features
      - name: Test (nextest with coverage)
        if: runner.os == 'Linux'
        env:
          RUST_LOG: ${{ runner.debug && 'turso_core::storage=trace' || '' }}
          LOCAL_SYNC_SERVER: "../../target/debug/tursodb"
        # for some reason, test(test_busy_snapshot_immediate) hung with coverage - so let's exclude it from the run for now
        run: |
          cargo llvm-cov nextest --workspace --all-features --locked --no-fail-fast --exclude memory-benchmark -E 'not binary(fuzz_tests) and not binary(pending_byte_tests) and not test(test_busy_snapshot_immediate)' --failure-output=final --html --output-dir coverage
          echo "::group::Coverage Summary"
          cargo llvm-cov report | tee coverage/summary.txt
          echo "::endgroup::"
        timeout-minutes: 20
      - name: Test (nextest)
        if: runner.os != 'Linux'
        env:
          RUST_LOG: ${{ runner.debug && 'turso_core::storage=trace' || '' }}
          LOCAL_SYNC_SERVER: "../../target/debug/tursodb"
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast --exclude memory-benchmark -E 'not binary(fuzz_tests) and not binary(pending_byte_tests)' --failure-output=final
        timeout-minutes: 30
      - name: Test doctests
        env:
          LOCAL_SYNC_SERVER: "../../target/debug/tursodb"
        run: cargo test --workspace --all-features --doc --locked --exclude memory-benchmark
      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Runs without --all-features because the corruption and short-read tests
  # are compile-gated on the "checksum" feature being disabled: with page
  # checksums active, byte-level corruption is caught at the pager layer
  # before integrity_check's structural validation ever runs. The tests
  # exercise platform-independent core logic, so one Linux runner suffices.
  integrity-corruption-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Test integrity_check corruption and short reads (no checksum feature because it interferes with the test)
        run: cargo nextest run -p core_tester --locked --no-fail-fast -E 'test(integrity_check) | test(short_read)' --failure-output=final
        timeout-minutes: 5

  build-windows-arm64-cli:
    # Stays on GitHub-hosted: Blacksmith Windows images lack the MSVC ARM64
    # cross tools (Microsoft.VisualStudio.Component.VC.Tools.ARM64).
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Windows ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-windows-arm64-cli"
          cache-on-failure: true
      - name: Build Windows ARM64 CLI
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vcvars = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (!$vcvars) {
            throw "Visual Studio ARM64 build tools not found"
          }

          & $env:ComSpec /c "call `"$vcvars`" x64_arm64 >nul && set CC_aarch64_pc_windows_msvc=cl.exe && cargo build -p turso_cli --bin tursodb --locked --target aarch64-pc-windows-msvc"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  build-wasm32-unknown-unknown:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32 Rust target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Check turso builds for wasm32-unknown-unknown
        run: cargo check -p turso --target wasm32-unknown-unknown --locked

  shuttle-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-shuttle"
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run shuttle tests
        run: |
          make test-shuttle

  conn-raw-api-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-conn-raw-api"
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run conn_raw_api-gated core tests
        run: cargo nextest run -p turso_core --features conn_raw_api --locked --no-fail-fast --failure-output=final

  # stress-nondeterminism-check:
  #   runs-on: blacksmith-4vcpu-ubuntu-2404
  #   timeout-minutes: 15
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - name: Setup mold linker
  #       uses: "./.github/shared/setup-mold"
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         prefix-key: "v1-rust-shuttle"
  #         cache-on-failure: true
  #     - name: Check for uncontrolled nondeterminism
  #       env:
  #         RUSTFLAGS: "--cfg tokio_unstable --cfg shuttle"
  #       run: |
  #         cargo run -p turso_stress -- --check-uncontrolled-nondeterminism

  clippy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Clippy
        run: |
          cargo clippy --workspace --all-features --all-targets --locked --exclude memory-benchmark -- --deny=warnings

  simulator:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    strategy:
      matrix:
        profile:
          - name: default
            iterations: 10
            args: "--maximum-tests 1000 --min-tick 10 --max-tick 50 --io-backend=memory"
          - name: InsertHeavy
            iterations: 5
            args: "--maximum-tests 1000 --min-tick 10 --max-tick 50 --profile write_heavy --io-backend=memory"
          - name: InsertHeavySpill
            iterations: 5
            args: "--maximum-tests 1000 --min-tick 10 --max-tick 50 --profile write_heavy_spill --io-backend=memory"
          - name: Faultless
            iterations: 10
            args: "--maximum-tests 1000 --min-tick 10 --max-tick 50 --profile faultless --io-backend=memory"
          - name: IOUring InsertHeavySpill
            iterations: 5
            args: "--io-backend=io-uring --maximum-tests 1000 --profile=write_heavy_spill"
          - name: IOUring Differential
            iterations: 10
            args: "--io-backend=io-uring --maximum-tests 1000 --differential"
          - name: Differential
            iterations: 10
            args: "--maximum-tests 1000 --differential --io-backend=memory"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      # Run these with for loops (instead of --loop flag in sim) so that each iteration gets a separate seed -- this produces much easier-to-debug traces when there's a failure since we don't have to potentially
      # run 10 iterations of the same seed to get to the failure
      - name: Simulator ${{ matrix.profile.name }}
        run: |
          for i in $(seq 1 ${{ matrix.profile.iterations }}); do
            ./scripts/run-sim ${{ matrix.profile.args }} || exit 1
          done

        # TODO: find out why this blows the stack so quickly every time..
        # e.g. https://github.com/tursodatabase/turso/actions/runs/22370904813/job/64749257476?pr=5588
